<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple student study planner to organize subjects and daily study tasks.">
  <title>Student Study Planner</title>
  <style>
    :root {
      --ink: #172554;
      --muted: #64748b;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --surface: #ffffff;
      --page: #f1f5ff;
      --line: #e2e8f0;
      --green: #15803d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #eef2ff, #f8fafc 55%, #e0f2fe);
      min-height: 100vh;
    }
    header {
      padding: 25px 20px;
      color: white;
      background: linear-gradient(120deg, #312e81, #4f46e5, #0284c7);
    }
    .header-inner, main { width: min(1000px, calc(100% - 32px)); margin: auto; }
    .brand { font-size: 14px; letter-spacing: 1.5px; opacity: .85; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: clamp(28px, 5vw, 42px); }
    header p { margin: 0; color: #e0e7ff; line-height: 1.5; }
    main { padding: 28px 0 48px; }
    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px;
    }
    .stat, .panel {
      background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 8px 25px rgba(30, 41, 59, .06);
    }
    .stat { padding: 17px 19px; }
    .stat span { display: block; color: var(--muted); font-size: 13px; }
    .stat strong { display: block; margin-top: 6px; font-size: 27px; }
    .layout { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 18px; align-items: start; }
    .panel { padding: 22px; }
    h2 { margin: 0 0 16px; font-size: 20px; }
    label { display: block; margin: 13px 0 7px; color: #334155; font-size: 14px; font-weight: 700; }
    input, select {
      width: 100%; padding: 12px 13px; border: 1px solid #cbd5e1; border-radius: 10px;
      font-size: 15px; background: white; color: var(--ink); outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px #c7d2fe; }
    button {
      border: 0; border-radius: 10px; padding: 12px 16px; font-size: 14px;
      font-weight: 700; cursor: pointer; transition: .15s ease;
    }
    button:hover { transform: translateY(-1px); }
    .add-btn { margin-top: 16px; width: 100%; color: white; background: var(--primary); }
    .add-btn:hover { background: var(--primary-dark); }
    .progress-track { height: 10px; border-radius: 20px; background: #e2e8f0; overflow: hidden; margin: 10px 0 18px; }
    .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #4f46e5, #06b6d4); transition: width .25s; }
    .task-list { display: grid; gap: 10px; }
    .task {
      display: flex; align-items: center; gap: 11px; padding: 13px;
      border: 1px solid var(--line); border-radius: 12px; background: #fff;
    }
    .task input { width: 18px; height: 18px; accent-color: var(--primary); flex: 0 0 auto; }
    .task-info { flex: 1; min-width: 0; }
    .task-title { font-weight: 700; overflow-wrap: anywhere; }
    .task-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .done .task-title { text-decoration: line-through; color: #94a3b8; }
    .delete-btn { color: #b91c1c; background: #fee2e2; padding: 8px 10px; }
    .empty { padding: 25px 12px; text-align: center; color: var(--muted); border: 1px dashed #cbd5e1; border-radius: 12px; }
    .filter-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .filter-row h2 { margin: 0; }
    .filter-row select { max-width: 145px; padding: 9px; }
    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 25px; }
    @media (max-width: 700px) {
      .stats { gap: 9px; }
      .stat { padding: 13px; }
      .stat strong { font-size: 23px; }
      .layout { grid-template-columns: 1fr; }
      .panel { padding: 18px; }
    }
    @media (max-width: 380px) {
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">Your personal learning space</div>
      <h1>Student Study Planner</h1>
      <p>Plan your day, track your progress, and make every study session count.</p>
    </div>
  </header>

  <main>
    <section class="stats" aria-label="Study statistics">
      <div class="stat"><span>Total tasks</span><strong id="totalCount">0</strong></div>
      <div class="stat"><span>Completed</span><strong id="doneCount">0</strong></div>
      <div class="stat"><span>Progress</span><strong id="progressText">0%</strong></div>
    </section>

    <section class="layout">
      <div class="panel">
        <h2>Add a study task</h2>
        <form id="taskForm">
          <label for="taskInput">Task name</label>
          <input id="taskInput" type="text" placeholder="e.g. Revise C programming loops" maxlength="90" required>
          <label for="subjectInput">Subject</label>
          <input id="subjectInput" type="text" placeholder="e.g. Computer Programming" maxlength="50" required>
          <label for="dateInput">Due date</label>
          <input id="dateInput" type="date">
          <button class="add-btn" type="submit">+ Add Task</button>
        </form>
      </div>

      <div class="panel">
        <div class="filter-row">
          <h2>My study tasks</h2>
          <select id="filterSelect" aria-label="Filter tasks">
            <option value="all">All tasks</option>
            <option value="pending">Pending</option>
            <option value="done">Completed</option>
          </select>
        </div>
        <div class="progress-track" aria-label="Task completion progress">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="task-list" id="taskList">
          <div class="empty">No tasks yet. Add your first study task!</div>
        </div>
      </div>
    </section>
  </main>

  <footer>Made for students • Stay consistent and keep learning.</footer>

  <script>
    const STORAGE_KEY = "studentStudyPlannerTasks";
    let tasks = [];

    try {
      tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (!Array.isArray(tasks)) tasks = [];
    } catch (error) {
      tasks = [];
    }

    const form = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const subjectInput = document.getElementById("subjectInput");
    const dateInput = document.getElementById("dateInput");
    const filterSelect = document.getElementById("filterSelect");
    const taskList = document.getElementById("taskList");

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function renderTasks() {
      const completed = tasks.filter(task => task.done).length;
      const total = tasks.length;
      const percent = total ? Math.round((completed / total) * 100) : 0;

      document.getElementById("totalCount").textContent = total;
      document.getElementById("doneCount").textContent = completed;
      document.getElementById("progressText").textContent = percent + "%";
      document.getElementById("progressFill").style.width = percent + "%";

      const filter = filterSelect.value;
      const visibleTasks = tasks.filter(task => {
        if (filter === "pending") return !task.done;
        if (filter === "done") return task.done;
        return true;
      });

      taskList.innerHTML = "";
      if (visibleTasks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = total === 0 ? "No tasks yet. Add your first study task!" : "No tasks in this filter.";
        taskList.appendChild(empty);
        return;
      }

      visibleTasks.forEach(task => {
        const item = document.createElement("div");
        item.className = "task" + (task.done ? " done" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", "Mark task complete");
        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const info = document.createElement("div");
        info.className = "task-info";
        const title = document.createElement("div");
        title.className = "task-title";
        title.textContent = task.title;
        const meta = document.createElement("div");
        meta.className = "task-meta";
        meta.textContent = task.subject + (task.date ? " • Due: " + task.date : "");
        info.append(title, meta);

        const remove = document.createElement("button");
        remove.className = "delete-btn";
        remove.type = "button";
        remove.textContent = "Delete";
        remove.addEventListener("click", () => {
          tasks = tasks.filter(current => current.id !== task.id);
          saveTasks();
          renderTasks();
        });

        item.append(checkbox, info, remove);
        taskList.appendChild(item);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const title = taskInput.value.trim();
      const subject = subjectInput.value.trim();
      if (!title || !subject) return;

      tasks.unshift({
        id: Date.now().toString() + Math.random().toString(16).slice(2),
        title,
        subject,
        date: dateInput.value,
        done: false
      });

      saveTasks();
      form.reset();
      renderTasks();
      taskInput.focus();
    });

    filterSelect.addEventListener("change", renderTasks);
    renderTasks();
  </script>
</body>
</html>
